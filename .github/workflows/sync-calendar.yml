name: Sync Google Calendar & Deploy Pages

on:
  push:
    branches:
      - main
  schedule:
    # Runs every 2 hours
    - cron: "0 */2 * * *"
  workflow_dispatch:

concurrency:
  group: "pages-and-calendar-sync"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    outputs:
      should_deploy: ${{ steps.check_changes.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch latest Google Calendar ICS feed
        run: |
          curl -fsSL "https://calendar.google.com/calendar/ical/chillchess802%40gmail.com/public/basic.ics" \
            | tr -d '\r' \
            | grep -v '^DTSTAMP:' > calendar.ics.tmp

          if grep -q "BEGIN:VCALENDAR" calendar.ics.tmp; then
            mv calendar.ics.tmp calendar.ics
          else
            echo "Invalid ICS response from Google Calendar"
            rm -f calendar.ics.tmp
            exit 1
          fi

      - name: Commit updated calendar.ics if changed
        id: check_changes
        run: |
          if ! git diff --quiet calendar.ics; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add calendar.ics
            git commit -m "chore: sync calendar.ics from Google Calendar"
            git push
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" != "schedule" ]; then
            echo "No changes in calendar.ics, but triggered by ${{ github.event_name }} — deploying Pages"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes in calendar.ics during scheduled check — skipping deploy"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: steps.check_changes.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: steps.check_changes.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
